en:
  commands:
    review_feeds_status:
      failed_feeds: "The following feeds couldn't get links:\n- %{feeds}"
      failed_channels: "The following feeds couldn't post to channels:\n- %{channels}"
  list_headers:
    feed_name: Feed
    url: URL
    channel: Channel
    added: Added
    added_by: Added by
    allow: Allow
    deny: Deny
    link_type: Link type
  podcast_rating:
    msg_confirm: "You rated this episode %{rating} ★"
