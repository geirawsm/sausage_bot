  msg_no_token: 'GITHUB_TOKEN er ikke satt i .env, så jeg kan ikke lage issues fra todo-kanalen'
  msg_untitled: Uten tittel
  attachments_heading: Vedlegg
  buttons:
    yes: Ja
    edit: Endre
    cancel: Avbryt
  msg_draft: "%{owner} Lage dette issuet i `%{repo}`?\n**Tittel:** %{title}\n**Beskrivelse:**\n%{body}"
  msg_draft_missing: Fant ikke dette utkastet lenger
  msg_issue_created: 'Issue #%{number}: %{url}'
  msg_issue_failed: 'Kunne ikke lage issuet: %{error}'
  modal:
    title: Endre issuet
    field_title: Tittel
    field_body: Beskrivelse
