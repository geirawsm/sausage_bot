nb:
  group:
    cmd: Utviklerverktøy (kun admin-guild)
  commands:
    channel:
      cmd: Sett todo-kanalen som gjør meldingene dine om til GitHub-issues
      desc:
        channel: Todo-kanalen
      msg_confirm: 'Todo-kanalen er nå %{channel}'
    repo:
      cmd: Sett GitHub-repoet issues lages i
      desc:
        repo: 'Repoet som eier/navn, f.eks. geirawsm/sausage_bot'
      msg_confirm: 'Issues lages nå i `%{repo}`'
      msg_invalid: 'Det er ikke et gyldig repo. Bruk formatet eier/navn'
    settings:
      cmd: Vis dev-innstillingene
      msg_settings: "Todo-kanal: %{channel}\nRepo: %{repo}\nGitHub-token: %{token}"
      not_set: ikke satt
      token_set: satt
      token_missing: mangler (legg til GITHUB_TOKEN i .env)
  msg_not_admin_guild: Denne kommandoen kan bare brukes i admin-guilden
