nb:
  owner_only: Kun for eier
  msg:
    failed_bot_start: Kunne ikke starte boten (%{error})
    bot_connected: "%{bot} har koblet til %{server}"
    bot_watching: tilfeldige youtube videoer
    create_log_channel_logging: "Innkommende logg-meldinger fra %{botname}"
  commands:
    language:
      confirm_language_set: Språk satt til `%{language}`. Restart botten manuelt for å synliggjøre endringer.
      msg_not_available: "`%{language}` er ikke et tilgjengelig språk."
    set_profile:
      command: "Endre botens kallenavn, avatar, banner eller bio på denne serveren"
      msg_no_permission: Du trenger Administrator- eller Manage Nicknames-tilgang for å bruke denne kommandoen
      msg_confirm: Bot-profilen ble oppdatert for denne serveren
      msg_failed: "Klarte ikke å oppdatere bot-profilen: %{error}"
    test:
      confirm: Norsk testmelding
    delete:
      command: "Slett `amount` antall meldinger i chaten"
      less_than_0: Tallet må være mer enn 0
      log_confirm: Massesletting via bot
      msg_confirm: Slettet %{amount} meldinger
    say:
      command: Sender melding til en kanal. Fyll inn `message_id` hvis det skal svares på en melding
      modal:
        title: Få boten til å sende en melding
        comment: Melding
        reply: "Nevn %{member}"
        confirm: "Melding sendt til `#%{channel}`"
        error_sending: "Det oppstod en feil ved sending av melding til %{channel}: %{error}"
        error_both_args: Både `message_id` og `reply` ble oppgitt, velg kun én'
    tasks:
      command: List opp denne serverens egne oppgaver og deres status
    tasks_global:
      command: "List opp alle godkjente serveres oppgaver og deres status (kun admin-server)"
      msg_not_admin_guild: Denne kommandoen kan kun brukes på admin-serveren.
      msg_empty: Fant ingen oppgaver for noen godkjente servere.
    version:
      command: Vis botens nåværende versjon og branch-info
    ping:
      command: Sjekk latency
    kick:
      command: Spark ut en bruker (med grunn)
      msg_confirm: "%{member} har blitt parket ut"
      msg_failed: "Klarte ikke å sparke ut: %{error}"
    ban:
      command: Utesteng en bruker (med grunn)
      msg_confirm: "%{member} har blitt utestengt"
      msg_failed: "Klarte ikke å utestenge: %{error}"
    synclocal:
      msg_starting: Starter kommando synkronisering...
      msg_cont_copy: Kopierer globale kommandoer...
      msg_confirm: Lokale kommandoer ble synkronisert med globale kommandoer
    syncglobal:
      msg_starting: Starter synkronisering av globale kommandoer...
      msg_confirm: Globale kommandoer synkronisert
    clearglobals:
      msg_starting: Sletter globale kommandoer...
      msg_confirm: Globale kommandoer slettet
    clearlocals:
      msg_starting: Sletter lokale kommandoer...
      msg_confirm: Lokale kommandoer slettet
    syncdev:
      msg_starting: Starter kommando synkronisering...
      msg_confirm: Kommandoer synkronisert
    sync:
      group_desc: Synkroniser slash-kommandoer
      msg_confirm_list: |-
        Kommandoer synkronisert!
        %{commands}
    guild:
      group_desc: Administrer guilder
      approve:
        msg_confirm: "✅ Godkjente guild %{guild_name} (%{guild_id})."
        msg_not_found: "❌ Ingen guild som samsvarer med `%{guild_id}` er registrert. Velg en guild fra autofullfør-lista i stedet for å skrive den inn - lista sender inn guild-id, ikke navnet."
      admin_channel:
        ac_create_new: "➕ Opprett #%{channel}"
        not_yours: Denne bekreftelsen er ikke din.
        btn_create: Opprett kanal
        msg_no_channel: "❌ Ingen kanal oppgitt. Velg en fra autofullfør-lista, eller skriv navnet på en kanal som skal opprettes."
        msg_channel_not_found: "❌ Ingen kanal med id `%{channel}` finnes i %{guild_name}. Den kan ha blitt slettet - prøv på nytt."
        msg_not_text_channel: "❌ `%{channel}` er ikke en tekstkanal."
        confirm_create: |-
          ⚠️ **%{channel}** finnes ikke i %{guild_name} (`%{guild_id}`).
          Opprette den og sette den som admin-kanal?
        msg_timeout: "⏲️ Tidsavbrudd - `%{channel}` ble ikke opprettet, og ingenting ble endret."
        msg_cancelled: "❌ Avbrutt - `%{channel}` ble ikke opprettet, og ingenting ble endret."
        msg_create_failed: "❌ Kunne ikke opprette `%{channel}`: %{error}"
      set_admin_guild:
        msg_not_member: "❌ Boten er ikke medlem av en guild som samsvarer med `%{guild}`. Velg en guild fra autofullfør-lista i stedet for å skrive den inn."
        msg_confirm: "✅ Admin-guild satt til %{guild_name} (`%{guild_id}`), admin-kanal #%{channel}."
        msg_db_failed: "❌ Klarte ikke å lagre admin-guilden i databasen. Ingenting ble endret - sjekk botloggen."
      set_admin_channel:
        msg_no_admin_guild: "❌ Boten er ikke lenger i sin egen admin-guild. Bruk `/guild set_admin_guild` for å peke den mot en den kan nå."
        msg_confirm: "✅ Admin-kanal satt til #%{channel} i %{guild_name}."
        msg_db_failed: "❌ Klarte ikke å lagre admin-kanalen i databasen. Ingenting ble endret - sjekk botloggen."
      leave:
        not_yours: Denne bekreftelsen er ikke din.
        btn_leave: Forlat guild
        msg_refuse_admin: "❌ Nekter å forlate admin-guilden."
        msg_not_member: "❌ Boten er ikke medlem av en guild med id `%{guild_id}`."
        confirm_prompt: |-
          ⚠️ Forlate guild **%{guild_name}** (`%{guild_id}`)?
          Guildens data beholdes - statusen settes kun til `removed`. Boten må inviteres inn på nytt for å bli med igjen.
        msg_timeout: "⏲️ Tidsavbrudd - fortsatt i %{guild_name} (%{guild_id})."
        msg_cancelled: "❌ Avbrutt - fortsatt i %{guild_name} (%{guild_id})."
        msg_failed: "❌ Kunne ikke forlate %{guild_name} (%{guild_id}): %{error}"
        msg_confirm: "✅ Forlot guild %{guild_name} (%{guild_id})."
    timezone:
      msg_confirm: "Satt tidssone til `%{timezone}`"
    bot_channel:
      create_modal:
        title: Lag bot-kanal fra en eksisterende kanal
        select_placeholder: Velg kanalen tillatelsene skal kopieres fra
        copy_from_label: "Kopier tillatelser fra:"
        name_label: Navn på den nye bot-kanalen
        source_not_found: Fant ikke kilde-kanalen. Prøv igjen.
        reason: "Oppretter bot-kanal (kopiert fra #%{source})"
        msg_confirm: "✅✅ Laget %{channel} (tillatelser kopiert fra #%{source}) og satt som bot-kanal."
      btn_duplicate: Dupliser eksisterende
      btn_fresh: Lag helt ny
      reason_fresh: Oppretter ny bot-kanal
      msg_confirm_fresh: "✅✅ Laget %{channel} og satt som bot-kanal."
      cancelled: Avbrutt. Lager ingen kanal.
      msg_not_exist: "Kanalen #%{channel} finnes ikke ennå. Hva vil du gjøre?"
      msg_confirm: "✅✅ Satt bot-kanal til #%{channel}."
    profile:
      group_desc: Endre bot-profil på denne serveren
    locale:
      group: "Endre språk eller tidssone"
      language:
        cmd: "Endre språk"
      timezone:
        cmd: "Endre tidssone"
  context_menu:
    edit_msg:
      name: Rediger bot melding
      not_bot: Meldingen ble ikke skrevet av boten
      edit_confirm: Meldingen ble endret
      edit_confirm_with_errors: ", men noen nevninger fungerte ikke: %{errors}"
      edit_error: "Feil ved endring av melding, sjekk loggen"
      channel_errors: "\nKanaler: %{errors}"
  notify_new_guild:
    rejoined: "🔔 Guild ble med igjen:"
    new: "🔔 Ny guild vil bruke boten:"
    details: |-
      **%{guild_name}** (`%{guild_id}`)
      Medlemmer: %{member_count}
      Beskrivelse: %{description}
      Vanity-url-kode: %{vanity_url_code}
    invite_link: "Invitasjonslenke: %{invite_url}"
    no_invite: Kunne ikke lage en invitasjonslenke for denne guilden.
    how_to_approve: "Bruk `/approve-guild guild_id:%{guild_id}` i denne kanalen for å aktivere den."
    auto_approved: Dette er admin-guilden, så den ble godkjent automatisk.
