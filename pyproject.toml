[project]
name = "sausage-bot"
version = "0.0.1"
requires-python = ">=3.14.0, <3.15"
dependencies = [
    "aiofiles",
    "aiosqlite",
    "bs4",
    "discord",
    "discord.py",
    "html5lib",
    "httpx",
    "i18nice[yaml]",
    "lxml",
    "numpy",
    "pendulum",
    "pip",
    "pyyaml",
    "requests>=2.32.0",
    "spotipy",
    "tabulate",
    "pillow>=13.0.0",
    "audioop-lts",
    "typing-extensions",
    "environs",
    "google-api-python-client",
    "cryptography",
    "aiohttp>=3.14.4",
    "certifi>=2026.10.19"
]

[dependency-groups]
dev = [
    "astpretty",
    "autopep8",
    "flake8",
    "flake8-l10n-checker",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pyyaml",
    "tabulate",
    "vulture",
    "graphifyy",
]
[tool.pyright]
reportMissingImports = false
reportArgumentype = false

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.sources]
flake8-l10n-checker = { path = "./sausage_bot/flake8-l10n-checker" }

[tool.ruff]
# line-length = 80
lint.extend-select = [
  "TID251" # flake8-tidy-imports: banned-api
]
lint.flake8-tidy-imports.banned-api."re.match".msg = "Use re.fullmatch() or re.search() instead"

