name: Build, test and deploy bot - main latest

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test_build_push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/cache@v5
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-pipenv-${{ hashFiles('Pipfile.lock') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev

      - name: Check locale files
        run: pipenv run python -m sausage_bot.util.check_locale_files

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          pipenv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          pipenv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: pipenv run python -m pytest

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKER_USER}}
          password: ${{secrets.DOCKER_TOKEN}}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{secrets.DOCKER_USER}}/sausage_bot

      - name: Short Github SHA
        run: echo "github_short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push versioned main
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: ./dockerfile
          tags: ${{secrets.DOCKER_USER}}/sausage_bot:${{ github.ref_name }}_$github_short_sha
          labels: |
            Branch=${{ github.ref_name }}
            Last commit_msg=${{ github.event.head_commit.message }}
            Last commit=${{ github.sha }}
            Last run number=${{ github.run_number }}
          build-args: |
            BRANCH=${{ github.ref_name }}
            LAST_COMMIT_MSG=${{ github.event.head_commit.message }}
            LAST_COMMIT=${{ github.sha }}
            LAST_RUN_NUMBER=${{ github.run_number }}

      - name: Build and push latest from main branch
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: ./dockerfile
          tags: ${{secrets.DOCKER_USER}}/sausage_bot:latest
          labels: |
            Branch=${{ github.ref_name }}
            Last commit_msg=${{ github.event.head_commit.message }}
            Last commit=${{ github.sha }}
            Last run number=${{ github.run_number }}
          build-args: |
            BRANCH=${{ github.ref_name }}
            LAST_COMMIT_MSG=${{ github.event.head_commit.message }}
            LAST_COMMIT=${{ github.sha }}
            LAST_RUN_NUMBER=${{ github.run_number }}
