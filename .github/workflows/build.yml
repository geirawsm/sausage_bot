name: Test, build and deploy bot

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/cache@v5
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-pipenv-${{ hashFiles('Pipfile.lock') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev

      - name: Check locale files
        run: pipenv run python -m sausage_bot.util.check_locale_files

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          pipenv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          pipenv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: pipenv run python -m pytest

  build_push:
    needs: test
    # Bare ved push til dev/main, aldri på PR-er
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKER_USER}}
          password: ${{secrets.DOCKER_TOKEN}}

      - name: Short SHA and commit msg
        id: vars
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # First line only, no quotes/backslashes: the value ends up in
          # a JSON string in the dockerfile and in a multi-line label list
          msg=$(printf '%s' "$COMMIT_MSG" | head -n1 | tr -d '"\\')
          echo "commit_msg=$msg" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: ./dockerfile
          tags: |
            ${{ secrets.DOCKER_USER }}/sausage_bot:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
            ${{ secrets.DOCKER_USER }}/sausage_bot:dev-${{ steps.vars.outputs.short_sha }}

          labels: |
            Branch=dev-${{ steps.vars.outputs.short_sha }}
            Last commit msg=${{ steps.vars.outputs.commit_msg }}
            Last commit=${{ github.sha }}
            Last run number=${{ github.run_number }}
          build-args: |
            BRANCH=dev-${{ steps.vars.outputs.short_sha }}
            LAST_COMMIT_MSG=${{ steps.vars.outputs.commit_msg }}
            LAST_COMMIT=${{ github.sha }}
            LAST_RUN_NUMBER=${{ github.run_number }}

  promote_to_main:
    needs: build_push
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Open PR dev -> main and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr create --base main --head dev \
            --title "Promote dev to main" \
            --body "Automatic promotion after green build on dev" \
            || echo "PR already exist (or no changes discovered)"

          # Retry: checks may not be registered on the PR right away
          for i in 1 2 3 4 5; do
            gh pr merge dev --auto --merge && exit 0
            sleep 10
          done
          exit 1
